[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "haps"
version = "0.0.1"
description = "Design analysis package for the NUST solar-electric HAPS/UAV final year design project"
requires-python = ">=3.12,<3.13"
dependencies = []  # filled in T-W0.02 together with env/environment.yml

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
