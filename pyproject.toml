[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "haps"
version = "0.0.1"
description = "Design analysis package for the NUST solar-electric HAPS/UAV final year design project"
requires-python = ">=3.12,<3.13"
# Runtime packages come from the conda environment (env/environment.yml + env/conda-lock.yml).
# The lists below exist only so CI and quick installs can run the tests without conda.
dependencies = []

[project.optional-dependencies]
# Needed only by haps.io.literature (literature intake, T-LIT.00): pip install -e ".[literature]"
literature = ["pymupdf>=1.24", "python-docx>=1.1"]
# Test and lint tools used by CI: pip install -e ".[dev]"
dev = ["pytest>=8", "ruff>=0.6", "pyyaml>=6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
